<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quarkus Chat</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        input {
            padding: 0.3em 1em;
            background: WhiteSmoke;
            border: 1px solid lightgray;
            border-radius: 3px;
            box-shadow: rgba(0, 0, 0, 0.05) 0 1px 0 0;
        }

        input[type="text"] {
            min-width: 30em;
        }

        input[type="button"] {
            min-width: 7em;
        }

        #chat {
            border: 1px solid black;
            min-height: 2em;
            padding: 0.3em 0.8em;
        }

        #sendButton {
            background-color: #2B7FFF;
            color: white;
        }

        .label {
            min-width: 5em;
            display: inline-block;
            font-weight: bold;
        }

        .system {
            color: #E12AFB;
        }

        .user {
            color: #51A2FF;
        }

        .info {
            color: gray;
        }
    </style>
</head>

<body>
<div class="container">
    <h2>Simple WebSocket Chat</h2>
    <form action="">
        <input id="user" type="text" placeholder="your name">
        <input id="connectButton" type="button" onclick="openWebsocket()" value="connect">
        <input type="button" onclick="closeWebsocket()" value="disconnect">
    </form>
    <br>
    <div id="chat"></div>
    <br>
    <form action="">
        <input id="message" type="text" placeholder="enter your message" disabled>
        <input id="sendButton" type="button" onclick="sendMessage()" value="send" disabled>
    </form>
    <br>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.4/socket.io.js"></script>
<script type="text/javascript">
    let socket = undefined;
    let connected = false;
    let username = "";

    function openWebsocket() {
        if (connected) {
            return;
        }

        socket = io("http://localhost:8081")

        socket.on("connect", () => {
            $("user").disabled = true;
            $("connectButton").disabled = true;
            $("message").disabled = false;
            $("sendButton").disabled = false;
            $("message").focus()
            connected = true;
            username = user.value
        });

        socket.on("disconnect", () => {
            connected = false;
            $("user").disabled = false;
            $("connectButton").disabled = false;
            $("message").disabled = true;
            $("sendButton").disabled = true;
        });

        socket.on("chat", (data) =>{
            console.log("Antwort vom Server: " + data.message);
            appendLine($("chat"), data.from, data.message, "user");
        });

        const chat = $("chat");
        socket.onmessage = function(event) {
            const msg = JSON.parse(event.data);

            switch (msg.type) {
                case "USER_JOINED":
                    if (msg.from !== username) {
                        appendLine(chat, null, `${msg.from} joined the chatroom.`, "info")
                    } else {
                        appendLine(chat, "System", `Howdy ${msg.from}!`, "system")
                    }
                    break;
                case "USER_LEFT":
                    appendLine(chat, null, `${msg.from} left the chatroom.`, "info")
                    break;
                case "CHAT_MESSAGE":
                    appendLine(chat, msg.from, msg.message, "user")
                    break;
            }

            $("message").value = ""
        }

        socket.onerror = function(event) {
            chat.innerHTML = `<p>Error: ${event.data}<p>` + chat.innerHTML;
        }
    }

    function closeWebsocket() {
        if(socket) {
            socket.close();
        }
    }

    // probably you want to escape user input on the backend
    function appendLine(chat, username, text, clazz) {
        const span = document.createElement("span");
        if (username) {
            span.classList.add("label", clazz);
            span.innerText = username + ":";
        }

        const p = document.createElement("p");
        p.append(span)
        span.after(text);

        chat.append(p);
    }

    function sendMessage() {
        socket.emit("chat", {
            from: $("user").value,
            message: $("message").value
        });
    }

    // poor man's version of jquery selector
    function $(elementId) {
        return document.getElementById(elementId);
    }

    function mapEnterKeyToFunction(elementId, functionName) {
        const inputElement = $(elementId);
        inputElement.addEventListener("keydown", event => {
            if (event.key === 'Enter') {
                event.preventDefault();
                functionName();
            }
        })
    }

    mapEnterKeyToFunction("user", openWebsocket);
    mapEnterKeyToFunction("message", sendMessage);
</script>
</body>

</html>
